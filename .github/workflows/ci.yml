name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install font verification dependencies
        run: python -m pip install fonttools==4.66.0 brotli==1.2.0

      - name: Verify CJK font cmap coverage
        run: python apps/web/scripts/check-cjk-font-cmap.py

      - name: Validate agent harness
        run: |
          test -x init.sh
          bash -n init.sh

      - name: Run agent harness
        run: ./init.sh

      - name: Require clean working tree
        run: test -z "$(git status --porcelain)"
