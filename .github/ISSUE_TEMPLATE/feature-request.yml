name: Feature request
description: Propose a product or developer-facing capability.
title: 'feat: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or repository problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: List important constraints, non-goals, or source material.
