name: Bug report
description: Report reproducible incorrect behavior.
title: 'bug: '
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the incorrect behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: main, tag, or commit SHA
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add screenshots, logs, fixtures, or source references when useful.
